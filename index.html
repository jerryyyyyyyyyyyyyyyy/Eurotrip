<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歐洲20天 — 旅遊總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#EEF0E9;--surface:#FFF;--surface-alt:#F6F7F2;
  --ink:#1E2A22;--ink-soft:#5C6B5E;--ink-faint:#8C998D;
  --line:#DBDFD2;--line-strong:#C3C9B8;
  --austria:#2F5233;--germany:#3E6E8E;--switzerland:#B9863A;--italy:#A8512E;
  --warn:#A8512E;--radius:10px;
  --shadow:0 1px 2px rgba(30,42,34,.06),0 1px 1px rgba(30,42,34,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Inter',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.page{max-width:980px;margin:0 auto;padding:0 20px 80px;}
/* Hero */
.hero{padding:40px 0 24px;border-bottom:1px solid var(--line);}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 10px;}
.hero-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:clamp(2.3rem,6vw,3.8rem);line-height:.95;margin:0 0 14px;text-transform:uppercase;}
.hero-route{font-size:14px;color:var(--ink-soft);margin:0 0 8px;line-height:1.8;}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;display:flex;align-items:baseline;gap:6px;}
.stat-num{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:17px;}
.stat-label{font-size:12.5px;color:var(--ink-soft);}
.status-chip{background:var(--austria);color:#fff;border-radius:var(--radius);padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;}
/* Sync bar */
.sync-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-soft);margin-top:10px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;transition:background .3s;}
.sync-dot.ok{background:#4caf50;}
.sync-dot.saving{background:var(--switzerland);animation:pulse .8s infinite;}
.sync-dot.error{background:var(--warn);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
/* Tabs */
.tabs{display:flex;gap:4px;margin:24px 0 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;padding-top:14px;overflow-x:auto;}
.tab-btn{appearance:none;border:none;background:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink-faint);padding:10px 16px;border-radius:8px 8px 0 0;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--austria);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
/* Elevation */
.elevation-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 8px;margin-bottom:18px;box-shadow:var(--shadow);}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 12px;}
.elevation-scroll{overflow-x:auto;}
#elevation-chart{display:block;min-width:880px;width:100%;height:auto;}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 4px 4px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
/* Itinerary */
.route-spine{position:relative;}
.spine-line{position:absolute;left:23px;top:8px;bottom:8px;width:2px;background:var(--line-strong);z-index:0;}
.stop-card{position:relative;z-index:1;display:flex;gap:16px;margin-bottom:18px;}
.stop-marker{flex:0 0 auto;width:48px;height:48px;display:flex;align-items:center;justify-content:center;}
.stop-marker span{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--dot,var(--austria));display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;}
.stop-body{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.stop-card.is-departure .stop-body{background:var(--surface-alt);}
.stop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.stop-date{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin:0 0 2px;}
.stop-city{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.stop-country{font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:700;}
.stop-nights{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;white-space:nowrap;padding-top:4px;}
.badge-today{background:var(--austria);color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;}
.side-trip{margin:10px 0 4px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:8px;font-size:13.5px;color:var(--ink-soft);background:var(--surface-alt);}
.side-trip-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--switzerland);margin-right:6px;}
.stop-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-top:14px;}
@media(max-width:620px){.stop-grid{grid-template-columns:1fr;}}
.field-block{min-width:0;}
.field-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 6px;}
.activity-list{list-style:none;margin:0;padding:0;}
.activity-list li{margin-bottom:6px;}
.activity-row{display:flex;align-items:center;gap:6px;}
.activity-note-box{display:none;margin-top:5px;width:100%;min-height:36px;font-size:12.5px;}
.activity-item.open .activity-note-box{display:block;}
/* Drag & time */
.drag-handle{cursor:grab;color:var(--line-strong);font-size:15px;flex:0 0 auto;padding:0 3px;line-height:1;user-select:none;-webkit-user-select:none;}
.drag-handle:hover{color:var(--ink-soft);}
.drag-handle:active{cursor:grabbing;}
.activity-item.dragging{opacity:.35;background:var(--surface-alt);}
.activity-item.drag-over-top{border-top:2px solid var(--austria);}
.activity-item.drag-over-bottom{border-bottom:2px solid var(--austria);}
.time-input{width:84px;flex:0 0 84px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 7px;color:var(--ink-soft);background:var(--surface-alt);border:1px solid var(--line);border-radius:6px;outline:none;}
.time-input:focus{border-color:var(--austria);color:var(--ink);background:var(--surface);}
/* Day timeline */
.day-timeline{margin-top:14px;padding:12px 14px;background:var(--surface-alt);border:1px solid var(--line);border-radius:8px;}
.tl-header{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.tl-header::after{content:'';flex:1;height:1px;background:var(--line);}
.tl-item{display:flex;align-items:flex-start;gap:10px;padding:5px 0;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:43px;top:20px;width:1px;bottom:-5px;background:var(--line);}
.tl-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:0 0 38px;padding-top:1px;}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--austria);flex:0 0 auto;border:2px solid var(--surface-alt);box-shadow:0 0 0 1.5px var(--austria);margin-top:3px;}
.tl-text{font-size:13px;color:var(--ink);line-height:1.4;}
input[type=text],input[type=number],textarea,select{font-family:'Noto Sans TC','Inter',sans-serif;font-size:13.5px;color:var(--ink);background:var(--surface-alt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--austria);background:var(--surface);}
textarea{resize:vertical;min-height:38px;}
.transport-mode{margin-bottom:6px;font-weight:600;}
.icon-btn{appearance:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;flex:0 0 auto;}
.icon-btn:hover{color:var(--warn);}
.add-btn{appearance:none;border:none;background:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--austria);padding:2px 0;}
.add-btn:hover{text-decoration:underline;}
/* Map */
.map-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
#ml-map{height:560px;border-radius:8px;}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;padding:14px 4px 0;}
/* MapLibre popup overrides */
.maplibregl-popup-content{padding:0;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(30,42,34,.15);border:1px solid #DBDFD2;width:270px;}
.maplibregl-popup-close-button{font-size:18px;padding:6px 10px;color:#8C998D;z-index:1;}
.maplibregl-popup-close-button:hover{background:none;color:#1E2A22;}
.popup-head{padding:12px 14px 10px;border-bottom:1px solid #DBDFD2;}
.popup-city{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;margin:0 0 3px;color:#1E2A22;}
.popup-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5C6B5E;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.popup-country-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.popup-body{padding:10px 14px 4px;}
.popup-section{margin-bottom:8px;}
.popup-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8C998D;margin:0 0 3px;}
.popup-value{font-size:12.5px;color:#1E2A22;line-height:1.5;}
.popup-activities{list-style:none;margin:0;padding:0;}
.popup-activities li{font-size:12.5px;color:#1E2A22;padding:2px 0;display:flex;gap:5px;align-items:baseline;}
.popup-activities li::before{content:"·";color:#8C998D;flex:0 0 auto;}
.popup-side-trip{background:#F6F7F2;border:1px dashed #C3C9B8;border-radius:6px;padding:7px 10px;margin:6px 0 4px;font-size:12px;color:#5C6B5E;}
.popup-side-trip-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#B9863A;margin-right:4px;}
.popup-jump-btn{display:block;width:100%;text-align:center;padding:8px;background:#2F5233;color:#fff;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:12.5px;border:none;cursor:pointer;margin-top:8px;}
.popup-jump-btn:hover{background:#3a6640;}
.map-marker{cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));transition:transform .15s;}
.map-marker:hover{transform:scale(1.15);}
.side-marker{cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));transition:transform .15s;}
.side-marker:hover{transform:scale(1.2);}
/* Budget */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;}
.card h4{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 10px;}
.budget-top{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0;}
@media(max-width:620px){.budget-top{grid-template-columns:1fr;}}
.big-num{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;}
.big-num.warn{color:var(--warn);}
.budget-input-row{display:flex;gap:8px;align-items:center;}
.budget-input-row select{width:auto;}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cat-label{flex:0 0 80px;font-size:13.5px;}
.cat-bar-wrap{flex:1 1 auto;height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.cat-bar{height:100%;background:var(--austria);}
.cat-bar.over{background:var(--warn);}
.cat-input{width:90px;flex:0 0 90px;}
.member-chip{display:inline-flex;align-items:center;gap:4px;background:var(--austria);color:#fff;border-radius:16px;padding:4px 10px 4px 12px;font-size:13px;}
.chip-remove{appearance:none;border:none;background:none;color:rgba(255,255,255,.8);cursor:pointer;font-size:15px;padding:0;line-height:1;}
.chip-remove:hover{color:#fff;}
.rates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:10px;}
.rate-item{display:flex;align-items:center;gap:6px;}
.rate-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
.rate-input{width:90px;flex:0 0 90px;text-align:right;}
.rate-unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
.expense-entry{border-bottom:1px solid var(--line);padding:9px 0;}
.expense-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.expense-split-info{font-size:12px;color:var(--ink-faint);padding:3px 0 0 4px;}
.exp-del-btn{appearance:none;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink-faint);border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;flex:0 0 auto;transition:all .15s;}
.exp-del-btn:hover{border-color:var(--warn);color:var(--warn);background:#fff8f7;}
.exp-confirm-row{display:none;align-items:center;gap:8px;padding:6px 4px 2px;font-size:12.5px;color:var(--warn);}
.exp-confirm-row.show{display:flex;}
.exp-confirm-yes{appearance:none;border:none;border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;background:var(--warn);color:#fff;font-weight:700;}
.exp-confirm-no{appearance:none;border:1px solid var(--line);border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;background:var(--surface-alt);color:var(--ink);}
.add-expense-form{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;}
.add-exp-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
.settlement-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.settlement-from,.settlement-to{font-weight:700;font-size:15px;}
.settlement-arrow{color:var(--ink-faint);font-size:13px;}
.settlement-amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;color:var(--austria);}
.btn{appearance:none;border:1px solid var(--austria);background:var(--austria);color:#fff;border-radius:7px;padding:8px 14px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;}
.btn:hover{opacity:.92;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-ghost{background:none;border-color:var(--line);color:var(--ink-soft);}
.btn-ghost:hover{border-color:var(--austria);color:var(--austria);opacity:1;}
/* Food section */
.food-section{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-strong);}
.food-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.food-section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#B9863A;margin:0;}
.food-item{display:flex;gap:8px;align-items:flex-start;background:#FFFBF5;border:1px solid #EDD9B8;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.food-item-body{flex:1;min-width:0;}
.food-name-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.food-idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#B9863A;font-weight:700;flex:0 0 16px;}
.food-link-row{display:flex;gap:6px;align-items:center;}
.food-open-btn{appearance:none;border:1px solid #EDD9B8;background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;flex:0 0 auto;transition:background .15s;white-space:nowrap;}
.food-open-btn:hover{background:#FFF0DC;border-color:#B9863A;}
.food-open-btn[disabled]{opacity:.3;cursor:default;}
.food-del-btn{appearance:none;border:none;background:none;color:#C3C9B8;cursor:pointer;font-size:17px;line-height:1;padding:2px;flex:0 0 auto;margin-top:1px;}
.food-del-btn:hover{color:var(--warn);}
.food-empty{font-size:13px;color:var(--ink-faint);padding:2px 0 6px;}
/* Packing */
.pack-cat{margin-bottom:22px;}
.pack-cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.pack-cat-title{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;}
.pack-cat-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
.pack-items{list-style:none;margin:0;padding:0;}
.pack-items li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.pack-items li label{flex:1;font-size:14.5px;cursor:pointer;}
.pack-items li.checked label{color:var(--ink-faint);text-decoration:line-through;}
.pack-items input[type=checkbox]{width:17px;height:17px;accent-color:var(--austria);cursor:pointer;}
.pack-add{display:flex;gap:8px;margin-top:8px;}
.pack-add input{flex:1;}
.pack-add button{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--surface-alt);border-radius:6px;padding:7px 12px;font-family:'Noto Sans TC',sans-serif;font-size:12px;cursor:pointer;}
.loading-line{color:var(--ink-faint);font-size:13.5px;padding:20px 0;}
.page-footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);text-align:center;}
.link-btn{appearance:none;border:none;background:none;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <p class="eyebrow">2026年7月14日 – 8月3日 · 旅遊總覽</p>
    <h1 class="hero-title">Alps 20 Days</h1>
    <p class="hero-route">維也納 → 哈爾施塔特 → 慕尼黑 → 蘇黎世 → 盧塞恩 → 格林德瓦 → 策馬特 → 米蘭 → 佛羅倫斯 → 威尼斯 → 多落米地（3天）→ 菲拉赫 → 維也納</p>
    <div class="sync-bar">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-label">連線中…</span>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="itinerary">行程</button>
    <button class="tab-btn" data-tab="map">地圖</button>
    <button class="tab-btn" data-tab="budget">預算 / 分帳</button>
    <button class="tab-btn" data-tab="packing">行李清單</button>
  </nav>

  <main>
    <section class="tab-panel active" id="panel-itinerary">
      <div class="elevation-card">
        <p class="section-label">海拔剖面 — 路線起伏</p>
        <div class="elevation-scroll"><svg id="elevation-chart" viewBox="0 0 1200 250"></svg></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="route-spine" id="itinerary-list">
        <div class="loading-line">載入行程中…</div>
      </div>
    </section>

    <section class="tab-panel" id="panel-map">
      <div class="map-card">
        <p class="section-label">互動地圖 — 縮放流暢，點擊標記查看城市詳情</p>
        <div id="ml-map"></div>
        <div class="map-legend" id="map-legend"></div>
      </div>
    </section>

    <section class="tab-panel" id="panel-budget">
      <div id="budget-content"><div class="loading-line">載入預算中…</div></div>
    </section>

    <section class="tab-panel" id="panel-packing">
      <div id="packing-content"><div class="loading-line">載入行李清單中…</div></div>
    </section>
  </main>

function formatDateRange(a,b){

}

function getTripStatus(){
  var t=new Date();t.setHours(0,0,0,0);
  var s=parseLocalDate(TRIP.start),e=parseLocalDate(TRIP.end);
  if(t<s){var days=Math.round((s-t)/86400000);return"還有"+days+"天出發";}
  if(t>=s&&t<=e){var d=Math.round((t-s)/86400000)+1;var tot=Math.round((e-s)/86400000)+1;return"第"+d+"天 / 共"+tot+"天";}
  return"旅程圓滿結束 🎉";
}

  html+=stat(20,"晚");html+=stat(SEGMENTS.filter(function(s){return!s.isDeparture;}).length,"目的地");
  html+=stat(Object.keys(countries).length,"國");html+=stat(SEGMENTS.filter(function(s){return s.sideTrip;}).length,"順遊");
  document.getElementById("stat-row").innerHTML=html;

}

/* =========================================================

   ========================================================= */
function renderElevationChart(){
  var w=1200,h=250,pL=40,pR=30,pT=20,pB=70,iW=w-pL-pR,iH=h-pT-pB;
  var elevs=SEGMENTS.map(function(s){return s.elevation;});
  var min=Math.min.apply(null,elevs),max=Math.max.apply(null,elevs),n=SEGMENTS.length;
  var pts=SEGMENTS.map(function(s,i){return{x:pL+(i/(n-1))*iW,y:pT+iH-((s.elevation-min)/((max-min)||1))*iH,seg:s};});
  var ls=pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
  var area="M"+pts[0].x.toFixed(1)+","+(pT+iH)+" L"+ls.replace(/ /g," L")+" L"+pts[pts.length-1].x.toFixed(1)+","+(pT+iH)+" Z";
  var svg='<defs><linearGradient id="eF" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2F5233" stop-opacity=".18"/><stop offset="100%" stop-color="#2F5233" stop-opacity="0"/></linearGradient></defs>';
  svg+='<path d="'+area+'" fill="url(#eF)"/><polyline points="'+ls+'" fill="none" stroke="#2F5233" stroke-width="2"/>';
  pts.forEach(function(p){
    var c=COUNTRY_HEX[p.seg.country]||"#888";
    svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5.5" fill="'+c+'" stroke="#fff" stroke-width="1.5" style="cursor:pointer" data-jump="'+p.seg.id+'"/>';
    svg+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-11).toFixed(1)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="#5C6B5E">'+p.seg.elevation+'m</text>';
    var lbl=p.seg.isDeparture?"維也納*":p.seg.city;
    svg+='<text x="'+p.x.toFixed(1)+'" y="'+(pT+iH+18).toFixed(1)+'" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="11" fill="#1E2A22" transform="rotate(-38 '+p.x.toFixed(1)+' '+(pT+iH+18).toFixed(1)+')" style="cursor:pointer" data-jump="'+p.seg.id+'">'+esc(lbl)+'</text>';
  });
  document.getElementById("elevation-chart").innerHTML=svg;
  document.getElementById("elevation-chart").addEventListener("click",function(e){var id=e.target.getAttribute("data-jump");if(id)jumpToItinerary(id);});
  var leg="";

}

/* ── Drag-and-drop reorder ── */
var _dragSrcSeg=null,_dragSrcIdx=-1;
function attachDragHandlers(list){
  list.addEventListener("dragstart",function(e){
    var li=e.target.closest("li.activity-item");
    if(!li)return;
    _dragSrcSeg=li.getAttribute("data-drag-seg");
    _dragSrcIdx=parseInt(li.getAttribute("data-drag-idx"),10);
    e.dataTransfer.effectAllowed="move";
    setTimeout(function(){li.classList.add("dragging");},0);
  });
  list.addEventListener("dragover",function(e){
    e.preventDefault();
    var li=e.target.closest("li.activity-item");
    if(!li||li.getAttribute("data-drag-seg")!==_dragSrcSeg)return;
    list.querySelectorAll(".drag-over-top,.drag-over-bottom").forEach(function(el){el.classList.remove("drag-over-top","drag-over-bottom");});
    var rect=li.getBoundingClientRect();
    var mid=rect.top+rect.height/2;
    if(e.clientY<mid)li.classList.add("drag-over-top");
    else li.classList.add("drag-over-bottom");
  });
  list.addEventListener("dragleave",function(e){
    var li=e.target.closest("li.activity-item");
    if(li){li.classList.remove("drag-over-top","drag-over-bottom");}
  });
  list.addEventListener("drop",function(e){
    e.preventDefault();
    var li=e.target.closest("li.activity-item");
    if(!li)return;
    var destSeg=li.getAttribute("data-drag-seg");
    var destIdx=parseInt(li.getAttribute("data-drag-idx"),10);
    var insertBefore=li.classList.contains("drag-over-top");
    li.classList.remove("drag-over-top","drag-over-bottom");
    if(_dragSrcSeg===destSeg&&_dragSrcIdx!==destIdx){
      var seg=findSeg(_dragSrcSeg);
      if(seg){
        var item=seg.activities.splice(_dragSrcIdx,1)[0];
        var newIdx=destIdx>_dragSrcIdx?destIdx-1:destIdx;
        if(!insertBefore)newIdx++;
        newIdx=Math.max(0,Math.min(seg.activities.length,newIdx));
        seg.activities.splice(newIdx,0,item);
        renderItinerary();saveItinerary();
      }
    }
    _dragSrcSeg=null;_dragSrcIdx=-1;
  });
  list.addEventListener("dragend",function(){
    list.querySelectorAll(".dragging,.drag-over-top,.drag-over-bottom").forEach(function(el){
      el.classList.remove("dragging","drag-over-top","drag-over-bottom");
    });
    _dragSrcSeg=null;_dragSrcIdx=-1;
  });
}

/* =========================================================
   BUDGET
   ========================================================= */
function getEffectiveRates(){
  var r={EUR:1};
  CURRENCIES.forEach(function(c){r[c.code]=(BUDGET.rates&&BUDGET.rates[c.code])||FALLBACK_RATES[c.code]||1;});
  return r;
}
function convertAmt(amount,from,to){
  if(from===to||!from||!to)return amount;
  var rates=getEffectiveRates();
  return amount/(rates[from]||1)*(rates[to]||1);
}
function fetchLiveRates(){
  var statusEl=document.getElementById("rates-status");
  if(statusEl)statusEl.textContent="匯率更新中…";
  var syms=CURRENCIES.filter(function(c){return c.code!=="EUR";}).map(function(c){return c.code;}).join(",");
  fetch("https://api.frankfurter.app/latest?from=EUR&to="+syms)
    .then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.rates){
        if(!BUDGET.rates)BUDGET.rates={};
        BUDGET.rates.EUR=1;
        Object.keys(data.rates).forEach(function(k){BUDGET.rates[k]=data.rates[k];});
        BUDGET.ratesUpdated=new Date().toISOString();
        saveBudget();renderBudget();
      }
    }).catch(function(){if(statusEl)statusEl.textContent="無法取得即時匯率，使用預設值";});
}
function computeBudgetTotals(){
  var spentByCat={};BUDGET_CATEGORIES.forEach(function(c){spentByCat[c.id]=0;});
  var totalSpent=0,disp=BUDGET.currency||"TWD";
  (BUDGET.expenses||[]).forEach(function(ex){
    var amt=convertAmt(parseFloat(ex.amount)||0,ex.currency||disp,disp);
    totalSpent+=amt;if(spentByCat[ex.category]!==undefined)spentByCat[ex.category]+=amt;
  });
  return{spentByCat:spentByCat,totalSpent:totalSpent};
}
function calculateSettlement(){
  var members=BUDGET.members||[];if(members.length<2)return[];
  var disp=BUDGET.currency||"TWD",bal={};
  members.forEach(function(m){bal[m]=0;});
  (BUDGET.expenses||[]).forEach(function(ex){
    var payer=ex.paidBy;if(!payer||bal[payer]===undefined)return;
    var sl=ex.splitAmong&&ex.splitAmong.length>0?ex.splitAmong:members.slice();
    sl=sl.filter(function(m){return bal[m]!==undefined;});
    if(!sl.length)return;
    var amt=convertAmt(parseFloat(ex.amount)||0,ex.currency||disp,disp);
    bal[payer]+=amt;sl.forEach(function(m){bal[m]-=amt/sl.length;});
  });
  var result=[],b=members.map(function(m){return{name:m,bal:bal[m]};});
  for(var i=0;i<50;i++){
    b.sort(function(a,c){return c.bal-a.bal;});
    var cr=b[0],db=b[b.length-1];if(cr.bal<0.01||db.bal>-0.01)break;
    var pay=Math.min(cr.bal,-db.bal);if(pay<0.01)break;
    result.push({from:db.name,to:cr.name,amount:pay});cr.bal-=pay;db.bal+=pay;
  }
  return result;
}
function labelForCat(id){for(var i=0;i<BUDGET_CATEGORIES.length;i++){if(BUDGET_CATEGORIES[i].id===id)return BUDGET_CATEGORIES[i].label;}return id;}
function renderBudget(){
  var disp=BUDGET.currency||"TWD",sym=getCurrency(disp).symbol;
  var totals=computeBudgetTotals(),totalNum=parseFloat(BUDGET.total)||0;
  var remaining=totalNum-totals.totalSpent,members=BUDGET.members||[];
  var rates=getEffectiveRates(),h="";

  // Members
  h+='<div class="card"><h4>👥 旅伴成員</h4>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  if(!members.length)h+='<span style="color:var(--ink-faint);font-size:13px">尚未新增成員 — 先新增才能使用分帳功能</span>';
  else members.forEach(function(m,i){h+='<span class="member-chip">'+esc(m)+'<button class="chip-remove" data-action="remove-member" data-idx="'+i+'">×</button></span>';});
  h+='</div><div style="display:flex;gap:8px"><input type="text" id="new-member-input" placeholder="輸入旅伴姓名" style="flex:1"><button class="btn btn-sm" id="add-member-btn">新增</button></div></div>';

  // Rates
  h+='<div class="card"><h4>💱 匯率（以歐元為基準）';
  if(BUDGET.ratesUpdated){var d=new Date(BUDGET.ratesUpdated);h+=' <span style="font-weight:400;font-size:11px;color:var(--ink-faint)">更新於'+(d.getMonth()+1)+'/'+(d.getDate())+'</span>';}
  h+='</h4><div class="rates-grid">';
  CURRENCIES.forEach(function(c){if(c.code==="EUR")return;var rate=rates[c.code]||1;h+='<div class="rate-item"><span class="rate-label">1 EUR =</span><input type="number" class="rate-input" data-currency="'+c.code+'" value="'+rate.toFixed(4)+'" step="0.0001"><span class="rate-unit">'+c.symbol+'</span></div>';});
  h+='</div><div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn btn-sm" id="fetch-rates-btn">🔄 取得即時匯率</button><span id="rates-status" style="font-size:12px;color:var(--ink-faint)"></span></div></div>';

  // Summary
  h+='<div class="budget-top" style="margin-bottom:16px">';
  h+='<div class="card" style="margin-bottom:0"><h4>旅遊總預算</h4><div class="budget-input-row"><select id="currency-select">';
  CURRENCIES.forEach(function(c){h+='<option value="'+c.code+'"'+(disp===c.code?" selected":"")+'>'+c.label+'</option>';});
  h+='</select><input type="number" id="total-budget-input" placeholder="例：200000" value="'+esc(BUDGET.total)+'"></div></div>';
  h+='<div class="card" style="margin-bottom:0"><h4>剩餘預算</h4><div class="big-num'+(remaining<0?" warn":"")+'">'+sym+' '+remaining.toLocaleString(undefined,{maximumFractionDigits:0})+'</div>';
  h+='<p style="color:var(--ink-soft);font-size:12.5px;margin:6px 0 0">已記錄 '+sym+' '+totals.totalSpent.toLocaleString(undefined,{maximumFractionDigits:0})+' / 共 '+sym+' '+totalNum.toLocaleString(undefined,{maximumFractionDigits:0})+'</p></div></div>';

  // Categories
  h+='<div class="card"><h4>分類預算</h4>';
  BUDGET_CATEGORIES.forEach(function(c){
    var planned=parseFloat((BUDGET.categories||{})[c.id])||0,spent=totals.spentByCat[c.id]||0;
    var pct=planned>0?Math.min(100,(spent/planned)*100):(spent>0?100:0),over=planned>0&&spent>planned;
    h+='<div class="cat-row"><span class="cat-label">'+c.label+'</span><div class="cat-bar-wrap"><div class="cat-bar'+(over?" over":"")+'" style="width:'+pct+'%"></div></div>';
    h+='<input type="number" class="cat-input" data-cat="'+c.id+'" placeholder="計畫金額" value="'+esc((BUDGET.categories||{})[c.id])+'">';
    h+='<span class="mono" style="font-size:12px;color:var(--ink-soft);width:72px;text-align:right">'+sym+' '+spent.toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  });
  h+='</div>';

  // Expenses
  h+='<div class="card"><h4>支出記錄</h4>';
  if(!(BUDGET.expenses||[]).length){h+='<p style="color:var(--ink-faint);font-size:13.5px">尚未記錄任何支出。</p>';}
  else{(BUDGET.expenses||[]).forEach(function(ex){
    var exAmt=parseFloat(ex.amount)||0,exSym=getCurrency(ex.currency||disp).symbol;
    var dispAmt=convertAmt(exAmt,ex.currency||disp,disp);
    var sl=ex.splitAmong&&ex.splitAmong.length?ex.splitAmong:(members.length?members:["全體"]);
    h+='<div class="expense-entry" id="exprow-'+ex.id+'"><div class="expense-main">';
    h+='<span class="mono" style="font-size:12px;color:var(--ink-soft);flex:0 0 44px">'+esc(ex.date||"—")+'</span>';
    h+='<span style="flex:1;font-size:13.5px">'+esc(ex.note||"—")+'</span>';
    h+='<span style="font-size:12px;color:var(--ink-soft);white-space:nowrap">'+labelForCat(ex.category)+'</span>';
    h+='<span class="mono" style="font-size:13px;white-space:nowrap">'+exSym+' '+exAmt.toLocaleString(undefined,{maximumFractionDigits:0});
    if(ex.currency&&ex.currency!==disp)h+=' <span style="color:var(--ink-faint);font-size:11px">≈'+sym+' '+dispAmt.toLocaleString(undefined,{maximumFractionDigits:0})+'</span>';
    h+='</span>';
    h+='<button class="exp-del-btn" data-action="init-delete" data-id="'+ex.id+'">刪除</button></div>';
    h+='<div class="expense-split-info">💳 '+esc(ex.paidBy||"—")+' 付款 → 分攤：'+sl.map(function(m){return esc(m);}).join("、")+'</div>';
    h+='<div class="exp-confirm-row" id="expconf-'+ex.id+'">';
    h+='<span>⚠ 確定刪除這筆支出？</span>';
    h+='<button class="exp-confirm-yes" data-action="confirm-delete" data-id="'+ex.id+'">確定刪除</button>';
    h+='<button class="exp-confirm-no" data-action="cancel-delete" data-id="'+ex.id+'">取消</button>';
    h+='</div></div>';
  });}
  // Add form
  h+='<div class="add-expense-form"><div class="add-exp-row">';
  h+='<input type="text" id="new-exp-date" placeholder="月/日" style="width:60px;flex:0 0 60px">';
  h+='<input type="text" id="new-exp-note" placeholder="說明" style="flex:1;min-width:80px">';
  h+='<select id="new-exp-cat" style="width:auto">';
  BUDGET_CATEGORIES.forEach(function(c){h+='<option value="'+c.id+'">'+c.label+'</option>';});
  h+='</select><input type="number" id="new-exp-amount" placeholder="金額" style="width:90px;flex:0 0 90px">';
  h+='<select id="new-exp-currency" style="width:auto">';
  CURRENCIES.forEach(function(c){h+='<option value="'+c.code+'"'+(disp===c.code?" selected":"")+'>'+c.symbol+'</option>';});
  h+='</select></div><div class="add-exp-row"><span style="font-size:12.5px;color:var(--ink-soft);white-space:nowrap">付款人：</span>';
  h+='<select id="new-exp-payer" style="width:auto"><option value="">— 選擇 —</option>';
  members.forEach(function(m){h+='<option value="'+esc(m)+'">'+esc(m)+'</option>';});
  h+='</select><span style="font-size:12.5px;color:var(--ink-soft);white-space:nowrap;margin-left:8px">分攤給：</span>';
  if(members.length){members.forEach(function(m){h+='<label style="display:flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;white-space:nowrap"><input type="checkbox" class="split-check" value="'+esc(m)+'" checked> '+esc(m)+'</label>';});}
  else{h+='<span style="color:var(--ink-faint);font-size:12px">（請先新增成員）</span>';}
  h+='<button class="btn btn-sm" id="add-expense-btn" style="margin-left:auto">＋ 記帳</button></div></div></div>';

  // Settlement
  if(members.length>=2){
    var settlements=calculateSettlement();
    h+='<div class="card"><h4>💰 結算清單</h4>';
    if(!settlements.length){h+='<p style="color:var(--ink-faint);font-size:13.5px">目前大家已結清，無需轉帳。</p>';}
    else{settlements.forEach(function(s){h+='<div class="settlement-item"><span class="settlement-from">'+esc(s.from)+'</span><span class="settlement-arrow">→ 付給 →</span><span class="settlement-to">'+esc(s.to)+'</span><span class="settlement-amt">'+sym+' '+Math.round(s.amount).toLocaleString()+'</span></div>';});}
    h+='</div>';
  }

  document.getElementById("budget-content").innerHTML=h;
  wireBudgetEvents();
}
function wireBudgetEvents(){
  var cc=document.getElementById("budget-content");
  var cs=document.getElementById("currency-select");if(cs)cs.addEventListener("change",function(e){BUDGET.currency=e.target.value;saveBudget();renderBudget();});
  var tb=document.getElementById("total-budget-input");if(tb)tb.addEventListener("input",function(e){BUDGET.total=e.target.value;saveBudget();renderBudgetRemaining();});
  cc.querySelectorAll(".cat-input").forEach(function(inp){inp.addEventListener("input",function(e){if(!BUDGET.categories)BUDGET.categories={};BUDGET.categories[e.target.getAttribute("data-cat")]=e.target.value;saveBudget();});inp.addEventListener("blur",renderBudget);});
  cc.querySelectorAll(".rate-input").forEach(function(inp){inp.addEventListener("change",function(e){if(!BUDGET.rates)BUDGET.rates={};BUDGET.rates[e.target.getAttribute("data-currency")]=parseFloat(e.target.value)||1;saveBudget();});});
  var fb=document.getElementById("fetch-rates-btn");if(fb)fb.addEventListener("click",fetchLiveRates);
  var amb=document.getElementById("add-member-btn");
  if(amb)amb.addEventListener("click",function(){var inp=document.getElementById("new-member-input"),name=inp.value.trim();if(!name)return;if(!BUDGET.members)BUDGET.members=[];if(BUDGET.members.indexOf(name)===-1){BUDGET.members.push(name);inp.value="";saveBudget();renderBudget();}else inp.value="";});
  var mi=document.getElementById("new-member-input");if(mi)mi.addEventListener("keydown",function(e){if(e.key==="Enter"){var b=document.getElementById("add-member-btn");if(b)b.click();}});
  cc.querySelectorAll('[data-action="remove-member"]').forEach(function(btn){btn.addEventListener("click",function(e){var idx=parseInt(e.target.getAttribute("data-idx"),10);BUDGET.members.splice(idx,1);saveBudget();renderBudget();});});
  var aeb=document.getElementById("add-expense-btn");
  if(aeb)aeb.addEventListener("click",function(){
    var amount=document.getElementById("new-exp-amount").value;if(!amount||parseFloat(amount)===0)return;
    var sl=[];cc.querySelectorAll(".split-check:checked").forEach(function(cb){sl.push(cb.value);});
    if(!BUDGET.expenses)BUDGET.expenses=[];
    BUDGET.expenses.push({id:"e"+Date.now(),date:document.getElementById("new-exp-date").value,note:document.getElementById("new-exp-note").value,category:document.getElementById("new-exp-cat").value,amount:amount,currency:document.getElementById("new-exp-currency").value,paidBy:document.getElementById("new-exp-payer").value,splitAmong:sl});
    saveBudget();renderBudget();
  });
  // Single expense delete — three-step: click 刪除 → confirm row appears → confirm or cancel
  cc.querySelectorAll('[data-action="init-delete"]').forEach(function(btn){
    btn.addEventListener("click",function(e){
      var id=e.target.getAttribute("data-id");
      var conf=document.getElementById("expconf-"+id);
      if(conf)conf.classList.toggle("show");
    });
  });
  cc.querySelectorAll('[data-action="confirm-delete"]').forEach(function(btn){
    btn.addEventListener("click",function(e){
      var id=e.target.getAttribute("data-id");
      BUDGET.expenses=BUDGET.expenses.filter(function(ex){return ex.id!==id;});
      saveBudget();renderBudget();
    });
  });
  cc.querySelectorAll('[data-action="cancel-delete"]').forEach(function(btn){
    btn.addEventListener("click",function(e){
      var id=e.target.getAttribute("data-id");
      var conf=document.getElementById("expconf-"+id);
      if(conf)conf.classList.remove("show");
    });
  });
}
function renderBudgetRemaining(){
  var disp=BUDGET.currency||"TWD",sym=getCurrency(disp).symbol;
  var totals=computeBudgetTotals(),totalNum=parseFloat(BUDGET.total)||0,rem=totalNum-totals.totalSpent;
  var el=document.querySelector("#budget-content .big-num");
  if(el){el.textContent=sym+" "+rem.toLocaleString(undefined,{maximumFractionDigits:0});el.className="big-num"+(rem<0?" warn":"");}
}

/* =========================================================
   PACKING
   ========================================================= */
function renderPacking(){
  var h="";
  PACKING_CATEGORIES.forEach(function(cat){
    var customs=PACKING_STATE.custom[cat.id]||[],all=cat.items.concat(customs);
    h+='<div class="pack-cat"><div class="pack-cat-head"><h3 class="pack-cat-title">'+esc(cat.title)+'</h3><span class="pack-cat-count" data-count-for="'+cat.id+'"></span></div><ul class="pack-items">';
    all.forEach(function(item,i){
      var itemId=cat.id+"-"+i,checked=!!PACKING_STATE.checked[itemId];
      h+='<li class="'+(checked?"checked":"")+'"><input type="checkbox" id="chk-'+itemId+'" data-item="'+itemId+'" '+(checked?"checked":"")+'><label for="chk-'+itemId+'">'+esc(item)+'</label></li>';
    });
    h+='</ul><div class="pack-add"><input type="text" placeholder="新增項目…" data-cat-add="'+cat.id+'"><button data-cat-add-btn="'+cat.id+'">新增</button></div></div>';
  });
  document.getElementById("packing-content").innerHTML=h;
  updatePackingCounts();
  document.querySelectorAll('#packing-content input[type=checkbox]').forEach(function(cb){cb.addEventListener("change",function(e){PACKING_STATE.checked[e.target.getAttribute("data-item")]=e.target.checked;e.target.closest("li").classList.toggle("checked",e.target.checked);savePacking();updatePackingCounts();});});
  document.querySelectorAll('[data-cat-add-btn]').forEach(function(btn){btn.addEventListener("click",function(e){var catId=e.target.getAttribute("data-cat-add-btn"),inp=document.querySelector('[data-cat-add="'+catId+'"]'),val=inp.value.trim();if(!val)return;if(!PACKING_STATE.custom[catId])PACKING_STATE.custom[catId]=[];PACKING_STATE.custom[catId].push(val);inp.value="";savePacking();renderPacking();});});
  document.querySelectorAll('[data-cat-add]').forEach(function(inp){inp.addEventListener("keydown",function(e){if(e.key==="Enter"){var b=document.querySelector('[data-cat-add-btn="'+e.target.getAttribute("data-cat-add")+'"]');if(b)b.click();}});});
}
function updatePackingCounts(){
  PACKING_CATEGORIES.forEach(function(cat){
    var customs=PACKING_STATE.custom[cat.id]||[],total=cat.items.length+customs.length,ch=0;
    for(var i=0;i<total;i++){if(PACKING_STATE.checked[cat.id+"-"+i])ch++;}
    var span=document.querySelector('[data-count-for="'+cat.id+'"]');
    if(span)span.textContent=ch+" / "+total+" 已打包";
  });
}

/* =========================================================
   TABS
   ========================================================= */
// Expose globally so Leaflet popup buttons can call them
window.jumpToItinerary=jumpToItinerary;
window.setActiveTab=function(n){setActiveTab(n);};

function setActiveTab(name){
  document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===name);});
  document.querySelectorAll(".tab-panel").forEach(function(p){p.classList.toggle("active",p.id==="panel-"+name);});
}
document.getElementById("tabs").addEventListener("click",function(e){var btn=e.target.closest(".tab-btn");if(!btn)return;setActiveTab(btn.getAttribute("data-tab"));});

/* =========================================================
   RESET
   ========================================================= */
document.getElementById("reset-btn").addEventListener("click",function(){
  if(!confirm("這將清除 Firebase 上所有人的行程、預算與行李資料，確定要重置嗎？"))return;
  Promise.all([fbDelete("itinerary-data"),fbDelete("budget-data"),fbDelete("packing-data")]).then(function(){
    SEGMENTS=JSON.parse(JSON.stringify(DEFAULT_SEGMENTS));normalizeActivities(SEGMENTS);
    BUDGET=JSON.parse(JSON.stringify(DEFAULT_BUDGET));
    PACKING_STATE={checked:{},custom:{}};
    renderAll();setSyncStatus("ok","資料已重置");
  }).catch(markError);
});

/* =========================================================
   REAL-TIME SYNC — poll Firebase every 5 seconds
   ========================================================= */
var _isEditing=false,_editTimeout=null;
document.addEventListener("focusin",function(e){
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")){
    _isEditing=true;clearTimeout(_editTimeout);
  }
});
document.addEventListener("focusout",function(){
  clearTimeout(_editTimeout);_editTimeout=setTimeout(function(){_isEditing=false;},2000);
});

function syncFromFirebase(){
  if(_isEditing)return;
  Promise.all([fbGet("itinerary-data"),fbGet("budget-data"),fbGet("packing-data")])
    .then(function(results){
      if(_isEditing)return;
      var newIt=serialize(results[0]),newBu=serialize(results[1]),newPa=serialize(results[2]);
      var changed=false;
      if(results[0]&&newIt!==_lastItinerary){SEGMENTS=results[0];normalizeActivities(SEGMENTS);
        if(migrateDolomites(SEGMENTS)){normalizeActivities(SEGMENTS);fbSet("itinerary-data",SEGMENTS).catch(function(){});}
        _lastItinerary=serialize(SEGMENTS);changed=true;}
      if(results[1]&&newBu!==_lastBudget){BUDGET=results[1];if(!BUDGET.rates)BUDGET.rates={};if(!BUDGET.members)BUDGET.members=[];_lastBudget=newBu;changed=true;}
      if(results[2]&&newPa!==_lastPacking){PACKING_STATE=results[2];if(!PACKING_STATE.checked)PACKING_STATE.checked={};if(!PACKING_STATE.custom)PACKING_STATE.custom={};_lastPacking=newPa;changed=true;}
      if(changed)renderAll();
      setSyncStatus("ok","已同步 ✓ — 所有成員即時可見");
    })
    .catch(function(){setSyncStatus("error","同步失敗，請檢查網路");});
}

/* =========================================================
   RENDER ALL
   ========================================================= */
function renderAll(){renderStats();renderElevationChart();renderMap();renderItinerary();renderBudget();renderPacking();}

/* =========================================================
   INIT — load from Firebase, then start sync loop
   ========================================================= */
setSyncStatus("saving","連線至 Firebase…");
Promise.all([fbGet("itinerary-data"),fbGet("budget-data"),fbGet("packing-data")])
  .then(function(results){
    SEGMENTS=results[0]||JSON.parse(JSON.stringify(DEFAULT_SEGMENTS));normalizeActivities(SEGMENTS);
    // Auto-migrate: if old single dolomites entry exists, split it into 3 and save back
    if(migrateDolomites(SEGMENTS)){
      normalizeActivities(SEGMENTS);
      fbSet("itinerary-data",SEGMENTS).catch(function(){});
      setSyncStatus("saving","自動升級多落米地為三天…");
    }
    BUDGET=results[1]||JSON.parse(JSON.stringify(DEFAULT_BUDGET));
    if(!BUDGET.rates)BUDGET.rates={};if(!BUDGET.members)BUDGET.members=[];
    PACKING_STATE=results[2]||{checked:{},custom:{}};
    if(!PACKING_STATE.checked)PACKING_STATE.checked={};if(!PACKING_STATE.custom)PACKING_STATE.custom={};
    _lastItinerary=serialize(SEGMENTS);_lastBudget=serialize(BUDGET);_lastPacking=serialize(PACKING_STATE);
    renderAll();
    setSyncStatus("ok","已同步 ✓ — 所有成員即時可見");
    setInterval(syncFromFirebase,5000);
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")syncFromFirebase();});
  })
  .catch(function(){
    setSyncStatus("error","無法連線 Firebase — 請檢查資料庫規則是否設為開放（test mode）");
    SEGMENTS=JSON.parse(JSON.stringify(DEFAULT_SEGMENTS));normalizeActivities(SEGMENTS);
    BUDGET=JSON.parse(JSON.stringify(DEFAULT_BUDGET));BUDGET.rates={};BUDGET.members=[];
    PACKING_STATE={checked:{},custom:{}};
    renderAll();
  });

})();
</script>
